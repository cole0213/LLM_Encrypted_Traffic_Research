project:
  project_id: "genai-traffic-fine-grained-fingerprinting"
  root: "/root/02_SGS/02_LLM/02_literature"
  topic: "GenAI traffic identification and TASK/AGENT-BEHAVIOUR inference from encrypted traffic only. Beyond service-name fingerprinting (which overlaps existing app classification), infer the interaction's task stage and agent behaviour: agent type (conversational vs coding vs research), output modality (text vs image vs voice), task complexity (simple query vs long reasoning vs tool use), deployment (local model vs cloud API), and autonomy (interactive user vs autonomous agent). Size, direction, timing only — no SNI/IP/port/certificate/payload shortcuts."
  research_questions:
    - "RQ1: GenAI vs ordinary web, streaming, and API traffic from size, direction, and timing only."
    - "RQ2: Agent-behaviour type — conversational AI vs coding agent vs research agent — inferred from traffic behaviour, not service name."
    - "RQ3: Output modality — text vs image vs voice generation — from stream cadence and bidirectional volume."
    - "RQ4: Task stage/complexity — simple query vs long reasoning (extended thinking) vs tool-use — after controlling prompt/output length."
    - "RQ5: Deployment and autonomy — local model vs cloud API; interactive user vs autonomous agent — from traffic pattern."
    - "RQ6: Robustness/drift and WHY behaviour-level labels generalise across services better than service-name fingerprints."
  include_scope:
    - "encrypted traffic classification and representation learning"
    - "fine-grained app/service/website fingerprinting without SNI/IP shortcuts"
    - "LLM network timing, token-streaming, output-token-count, and side-channel studies"
    - "real-time voice, WebRTC, QUIC, SSE, chunked streaming, and timing analysis"
    - "LLM reasoning/extended-thinking/inference-latency traffic characteristics"
    - "LLM agent / tool-use / agentic workflow traffic; autonomous-agent vs human/bot traffic distinction"
    - "task-type inference and interaction-behaviour recognition from traffic"
    - "open-world, OOD, hierarchical/multitask classification, drift, and cross-environment generalization"
  exclude_scope:
    - "payload/DPI or plaintext reconstruction"
    - "LLMs used merely for IDS, anomaly detection, or traffic generation"
    - "malware/IDS tasks not relevant to service identification"
    - "pure NLP/ASR/generation work without traffic, timing, side-channel, or service-identification relevance"
    - "SNI, IP, port, certificate, and endpoint-identity shortcuts"
